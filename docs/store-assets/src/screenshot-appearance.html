*{box-sizing:border-box;margin:0;padding:0}
body{background:#262421;color:#F1F1F1;font-family:Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;overflow:hidden}
.screen{width:1080px;height:1920px;display:flex;flex-direction:column;padding-top:56px}
.status{position:absolute;top:0;left:0;right:0;height:56px;display:flex;justify-content:space-between;

.bar .name{font-size:44px;font-weight:600}

.clock{font-size:58px;font-weight:700;padding:8px 34px;border-radius:18px;background:#312E2B}
.clock.active{background:#3C3935}
.moves{background:#312E2B;padding:26px 30px;font-size:38px;display:flex;gap:18px;white-space:nowrap;overflow:hidden}
.moves .n{color:#A09D98}
.actions{display:flex;justify-content:space-evenly;margin-top:22px}
.action{display:flex;flex-direction:column;align-items:center;font-size:30px;color:#F1F1F1;padding:12px 26px}
.action .g{font-size:62px;line-height:1.1;font-weight:700}
.card{background:#312E2B;border-radius:36px;padding:44px}
.badge{display:inline-block;border-radius:50px;padding:6px 26px;color:#000;font-weight:700;font-size:36px}
